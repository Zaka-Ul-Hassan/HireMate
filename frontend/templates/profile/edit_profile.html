{% extends "shared/base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="profile-box mx-auto shadow rounded bg-white p-4" style="max-width: 800px;">
        <h3 class="mb-4 text-center">Edit Profile</h3>

        <form method="POST" action="{{ url_for('update_profile_route', user_id=user.Id) }}" enctype="multipart/form-data">
            <div class="row g-3">
                <!-- First Name -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">First Name</label>
                    <input type="text" class="form-control" name="first_name" value="{{ user.FirstName }}" required>
                </div>

                <!-- Middle Name -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Middle Name</label>
                    <input type="text" class="form-control" name="middle_name" value="{{ user.MiddleName }}">
                </div>

                <!-- Last Name -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Last Name</label>
                    <input type="text" class="form-control" name="last_name" value="{{ user.LastName }}" required>
                </div>

                <!-- Age -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Age</label>
                    <input type="number" class="form-control" name="age" value="{{ user.Age }}">
                </div>

                <!-- Gender -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Gender</label>
                    <select class="form-select" name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male" {% if user.Gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if user.Gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if user.Gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <!-- DOB -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Date of Birth</label>
                    <input type="date" class="form-control" name="dob" value="{{ user.Dob|date('Y-m-d') }}">
                </div>

                <!-- Address -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Address</label>
                    <input type="text" class="form-control" name="address" value="{{ user.Address }}">
                </div>

                <!-- Country -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Country</label>
                    <input type="text" class="form-control" name="country" value="{{ user.Country }}">
                </div>

                <!-- Phone -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Phone Number</label>
                    <input type="text" class="form-control" name="phone_number" value="{{ user.PhoneNumber }}">
                </div>

                <!-- Email (Read Only) -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ user.Email }}" readonly>
                </div>

                <!-- Profile Image -->
                <div class="col-md-12">
                    <label class="form-label fw-bold">Profile Image</label>
                    {% if user.Image %}
                        <div class="mb-2">
                            <img src="{{ url_for('static', filename='uploads/' + user.Image) }}" alt="Profile Image"
                                 class="rounded-circle" width="100" height="100">
                        </div>
                    {% endif %}
                    <input type="file" class="form-control" name="image">
                </div>
            </div>

            <div class="d-flex justify-content-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

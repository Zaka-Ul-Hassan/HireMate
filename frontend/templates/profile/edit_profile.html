{% extends "shared/base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="profile-box mx-auto shadow rounded bg-white p-4" style="max-width: 900px;">
        <h3 class="mb-4 text-center">Edit Profile</h3>

        <form method="POST" action="{{ url_for('update_profile_route', user_id=resume.UserId) }}">
            <div class="row g-3">
                <!-- Basic Info -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" name="full_name" value="{{ resume.FullName }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ resume.Email }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Phone</label>
                    <input type="text" class="form-control" name="phone" value="{{ resume.PhoneNumber }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Address</label>
                    <input type="text" class="form-control" name="address" value="{{ resume.Address }}">
                </div>
            </div>

            <!-- Career Info -->
            <div class="mb-3 mt-3">
                <label class="form-label fw-bold">Objective</label>
                <textarea class="form-control" name="objective" rows="3">{{ resume.Objective }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Summary</label>
                <textarea class="form-control" name="summary" rows="3">{{ resume.Summary }}</textarea>
            </div>

            <!-- Skills -->
            <div class="mb-3">
                <label class="form-label fw-bold">Skills</label>
                <input type="text" class="form-control" name="skills" value="{{ resume.Skills }}">
            </div>

            <!-- Education -->
            <div class="mb-3">
                <label class="form-label fw-bold">Education</label>
                <input type="text" class="form-control mb-1" name="education1" value="{{ resume.Education1 }}">
                <input type="text" class="form-control mb-1" name="education2" value="{{ resume.Education2 }}">
                <input type="text" class="form-control" name="education3" value="{{ resume.Education3 }}">
            </div>

            <!-- Experience -->
            <div class="mb-3">
                <label class="form-label fw-bold">Experience</label>
                <textarea class="form-control" name="experience_description" rows="3">{{ resume.ExperienceDescription }}</textarea>
                <input type="text" class="form-control mt-1" name="total_experience" value="{{ resume.TotalExperience }}">
            </div>

            <!-- Projects -->
            <div class="mb-3">
                <label class="form-label fw-bold">Projects</label>
                <input type="text" class="form-control mb-1" name="project1" value="{{ resume.Project1 }}">
                <input type="text" class="form-control" name="project2" value="{{ resume.Project2 }}">
            </div>

            <!-- Certifications -->
            <div class="mb-3">
                <label class="form-label fw-bold">Certifications</label>
                <input type="text" class="form-control" name="certifications" value="{{ resume.Certifications }}">
            </div>

            <!-- Languages -->
            <div class="mb-3">
                <label class="form-label fw-bold">Languages</label>
                <input type="text" class="form-control" name="languages" value="{{ resume.Languages }}">
            </div>

            <!-- Links -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">LinkedIn</label>
                    <input type="text" class="form-control" name="linkedin" value="{{ resume.LinkedIn }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">GitHub</label>
                    <input type="text" class="form-control" name="github" value="{{ resume.GitHub }}">
                </div>
            </div>

            <div class="d-flex justify-content-center mt-4">
                <button type="submit" class="btn btn-primary">Save Profile</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

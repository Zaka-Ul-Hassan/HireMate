<!-- frontend/templates/job/list.html -->

{% extends "shared/base.html" %}
{% block title %}Job Listings{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/job/list.css">
{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <h2 class="text-center mb-5">Recommended Jobs</h2>

    <!-- Placeholder for error alerts -->
    <div id="jobAlert"></div>

    <!-- Template (hidden) -->
    <div id="jobTemplate" class="card flex-row align-items-center p-3 shadow-sm rounded border-0 hover-effect" style="display: none;">
        <div class="flex-grow-1">
            <h5 class="mb-1 job-title"></h5>
            <p class="mb-1 text-muted company-name"></p>

            <div class="d-flex flex-wrap gap-2 mb-2 tag-list"></div>

            <div class="d-flex flex-wrap align-items-center gap-3 text-muted small">
                <span class="job-location"></span><br>
                <span class="posted-date"></span>
            </div>
        </div>

        <div class="ms-auto text-end">
            <a class="btn btn-primary job-view-btn" target="_blank">View</a>
            <br>
            <a class="small d-block mt-1 text-decoration-none text-muted job-company-link" target="_blank">Company ↗</a>
        </div>
    </div>

    <!-- Jobs go here -->
    <div id="jobContainer" class="d-flex flex-column gap-3 ms-1"></div>

    <!-- Spinner -->
<div id="loadingSpinner" class="text-center my-5" style="display: none;">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/job/list.js" defer></script>
{% endblock %}

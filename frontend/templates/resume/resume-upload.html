<!-- frontend\templates\resume\upload-resume.html -->

{% extends 'shared/base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/resume/resume-upload.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="upload-container" onclick="document.getElementById('resumeUpload').click()"
  ondragover="event.preventDefault()" ondrop="handleFileDrop(event)">
  <p><strong>Drag and drop your resume here</strong>, or click to upload</p>
  <input type="file" id="resumeUpload" accept=".pdf,.docx" style="display: none;" />
</div>

<div class="file-info mt-2 text-center" id="fileInfo">
  <span>Accepted formats: <strong>PDF AND DOCX</strong></span><br>
  <div class="file-info">
    <span id="fileName" class="file-name text-success"></span>
  </div>
</div>

<div class="d-flex justify-content-center mt-3">
  <button class="btn btn-primary" id="uploadBtn">
    <i class="fas fa-upload me-2"></i> Upload Resume
  </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/static/js/resume/resume-upload.js"></script>
{% endblock %}

<!-- frontend\templates\resume\resume.html -->

{% block extra_css %}
<link rel="stylesheet" href="/static/css/resume/resume.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="upload-container" onclick="document.getElementById('resumeUpload1').click()">
  <p><strong>Drag and drop your resume here</strong>, or click to upload</p>
  <input type="file" id="resumeUpload1" accept=".pdf,.doc,.docx" />
</div>
<div class="file-info">
  Accepted formats: <strong>PDF, DOC, DOCX</strong>. Max file size: <strong>5MB</strong>.
</div>
{% endblock %}

<!-- frontend/templates/shared/sidebar.html -->

{% block extra_css %}
<link rel="stylesheet" href="/static/css/layout/sidebar.css">
{% endblock %}

<aside class="sidebar">
  <div class="side-inner">
    <div class="profile">
      <!-- Avatar: JS will populate initials or image from localStorage -->
      <div class="avatar-placeholder" id="sidebarAvatar">
        <!-- filled by sidebar.js -->
      </div>

      <h3 class="name" id="sidebarName">
        <!-- filled by sidebar.js -->
      </h3>

      <span class="country" id="sidebarAddress" style="display:none;"></span>
    </div>

    <div class="nav-menu">
      <ul class="nav flex-column sidebar-menu">

        <!-- Manage User - Shown to superadmin only -->
        <li class="nav-item" data-role="superadmin">
          <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
            href="#userMenu" role="button" aria-expanded="false">
            <span><i class="fas fa-users-cog me-2"></i>User</span>
            <span class="menu-arrow">&#9662;</span>
          </a>
          <ul class="collapse list-unstyled ps-3" id="userMenu">
            <li><a class="nav-link submenu-link" href="/user/manage">
                <i class="fas fa-edit me-2"></i>Manage User
              </a></li>
          </ul>
        </li>

        <!-- Resume Dropdown - Only for User role, now visible to superadmin too -->
        <li class="nav-item" data-role="user,superadmin">
          <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
            href="#resumeMenu" role="button" aria-expanded="false">
            <span><i class="fas fa-file-alt me-2"></i>Resume</span>
            <span class="menu-arrow">&#9662;</span>
          </a>
          <ul class="collapse list-unstyled ps-3" id="resumeMenu">
            <li><a class="nav-link submenu-link" href="/resume/manage">
                <i class="fas fa-edit me-2"></i>Manage Resume
              </a></li>
          </ul>
        </li>

        <!-- Resume List - Only for Employer role, now visible to superadmin too -->
        <li class="nav-item" data-role="employer,superadmin">
          <a class="nav-link" href="/resume/list">
            <i class="fas fa-list me-2"></i>Resume List
          </a>
        </li>

        <!-- Email Dropdown - Shown to all authenticated users -->
        <li class="nav-item" data-role="user,employer,superadmin">
          <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
            href="#emailMenu" role="button" aria-expanded="false">
            <span><i class="fas fa-envelope me-2"></i>Email</span>
            <span class="menu-arrow">&#9662;</span>
          </a>
          <ul class="collapse list-unstyled ps-3" id="emailMenu">
            <li><a class="nav-link submenu-link" href="/email/compose-email">
                <i class="fas fa-pen me-2"></i>Compose Email
              </a></li>
            <li><a class="nav-link submenu-link" href="/email/sent">
                <i class="fas fa-paper-plane me-2"></i>Sent Emails
              </a></li>
            <li><a class="nav-link submenu-link" href="/email/inbox">
                <i class="fas fa-inbox me-2"></i>Email Inbox
              </a></li>
            <li><a class="nav-link submenu-link" href="/email/settings">
                <i class="fas fa-cog me-2"></i>Email Settings
              </a></li>
          </ul>
        </li>

        <!-- Find Jobs - Only for User role, now visible to superadmin too -->
        <li class="nav-item" data-role="user,superadmin">
          <a class="nav-link" href="/job/list" id="findJobButton">
            <i class="fas fa-briefcase me-2"></i>Find Jobs
          </a>
        </li>

        <!-- Find Candidates - Only for Employer role, now visible to superadmin too -->
        <li class="nav-item" data-role="employer,superadmin">
          <a class="nav-link" href="/resume/rag" id="findCandidateButton">
            <i class="fas fa-users me-2"></i>Find Candidates
          </a>
        </li>

        <!-- Logout - Shown to all authenticated users -->
        <li class="nav-item" data-role="user,employer,superadmin">
          <a class="nav-link logout-link" href="javascript:void(0);" id="logoutButton">
            <i class="fas fa-sign-out-alt me-2"></i>Log out
          </a>
        </li>
      </ul>
    </div>
  </div>
</aside>


{% block extra_js %}
<script src="/static/js/layout/sidebar.js"></script>
<script src="/static/js/user/logout.js"></script>
{% endblock %}

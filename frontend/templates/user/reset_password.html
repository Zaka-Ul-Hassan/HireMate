<!-- frontend\templates\user\reset_password.html -->

{% extends "shared/base.html" %}

{% block title %}Reset Your Password{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/shared/password-toggle.css">
{% endblock %}

{% block content %}
<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm w-100" style="max-width: 500px; border-radius: 8px;">
        <div class="card-body">

            <h5 class="card-title fw-bold mb-3 text-center">Reset Your Password</h5>
            <p class="mb-4 text-center">Please enter your new password below.</p>

            <form id="resetPasswordForm">
                <!-- Hidden token field -->
                <input type="hidden" name="token" value="{{ token }}">

                <!-- New Password -->
                <div class="col-12 mb-3">
                    <div class="password-wrapper position-relative">
                        <label class="form-label" for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" class="form-control"
                               placeholder="Enter your new password">
                        <i id="toggleNewPassword" class="fa fa-eye-slash password-toggle"
                           onclick="togglePassword('new_password', 'toggleNewPassword')"></i>
                    </div>
                    <span class="text-danger" id="newPasswordError"></span>
                </div>

                <!-- Confirm Password -->
                <div class="col-12 mb-3">
                    <div class="password-wrapper position-relative">
                        <label class="form-label" for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                               placeholder="Confirm your password">
                        <i id="toggleConfirmPassword" class="fa fa-eye-slash password-toggle"
                           onclick="togglePassword('confirm_password', 'toggleConfirmPassword')"></i>
                    </div>
                    <span class="text-danger" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary w-100" style="padding: 10px;">
                    Update Password
                </button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <a href="/" class="text-decoration-none text-primary-custom">Back to Login</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="/static/js/shared/password-toggle.js"></script>
<script src="/static/js/user/reset_password.js"></script>
{% endblock %}

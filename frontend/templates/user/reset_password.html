<!-- frontend\templates\user\reset_password.html -->

{% extends "shared/base.html" %}
{% block title %}Reset Your Password{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh; background-color: #f0f2f5;">
    <div class="card shadow-sm" style="width: 420px; border-radius: 8px;">
        <div class="card-body text-center">

            <h5 class="card-title fw-bold mb-3">Reset Your Password</h5>
            <p class="mb-4">Please enter your new password below.</p>

            <form method="POST" action="/api/users/reset-password">
                <!-- Hidden token field -->
                <input type="hidden" name="token" value="{{ token }}">

                <!-- New password -->
                <input type="password" name="new_password" class="form-control mb-3"
                       placeholder="New password" required style="height: 48px; font-size: 16px;">

                <!-- Confirm password -->
                <input type="password" name="confirm_password" class="form-control mb-4"
                       placeholder="Confirm password" required style="height: 48px; font-size: 16px;">

                <button type="submit" class="btn btn-primary w-100" style="padding: 10px;">
                    Update Password
                </button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <a href="/login" class="btn btn-link">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

<!-- frontend\templates\user\login.html -->
{% extends "shared/base.html" %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/user/login.css">
<link rel="stylesheet" href="/static/css/shared/password-toggle.css">
{% endblock %}

{% block content %}
<div class="container-fluid login-container row">

  <!-- Left Side Image -->
  <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center">
    <img src="/static/images/login_images/loginImg.jpg" alt="Login Visual" class="login-image">
  </div>

  <!-- Right Side Form -->
  <div class="col-md-6 d-flex align-items-center justify-content-center">
    <div class="login-form">
      <h2 class="mb-3 fw-bold">Log in</h2>
      <p class="mb-4 text-muted">Enter your details below to sign in.</p>

      <form id="loginForm" method="POST" action="javascript:void(0);">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3 password-wrapper">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password">
          <i id="toggleIcon" class="fa fa-eye-slash password-toggle" onclick="togglePassword('password', 'toggleIcon')">
          </i>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" name="remember" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="/forgot-password" class="text-decoration-none text-primary-custom">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>


      <div class="mt-3">
        Don’t have an account? <a href="/register" class="text-primary-custom text-decoration-none">Registration</a>
      </div>
    </div>
  </div>

</div>
{% endblock %}

<!-- Link your JS -->
{% block extra_js %}
<script src="/static/js/user/login.js"></script>
<script src="/static/js/shared/password-toggle.js"></script>
{% endblock %}
